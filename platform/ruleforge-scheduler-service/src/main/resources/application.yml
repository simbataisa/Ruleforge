spring:
  # Java 21+ virtual threads for request handling, @Async and scheduling
  threads:
    virtual:
      enabled: true
  application:
    name: ruleforge-scheduler-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ruleforge
    username: ruleforge
    password: ruleforge_dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  quartz:
    job-store-type: memory
    auto-startup: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${RULEFORGE_JWT_SECRET:local-dev-jwt-secret-minimum-64-bytes-change-before-production-000000000000000000}
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 604800000

ruleforge:
  solver:
    url: http://localhost:8083
