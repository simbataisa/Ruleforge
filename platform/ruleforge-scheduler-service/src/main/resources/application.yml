spring:
  application:
    name: ruleforge-scheduler-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ruleforge
    username: ruleforge
    password: ruleforge_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8086

spring:
  quartz:
    job-store-type: memory
    auto-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ruleforge:
  solver:
    url: http://localhost:8083
