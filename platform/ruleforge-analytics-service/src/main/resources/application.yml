spring:
  # Java 21+ virtual threads for request handling, @Async and scheduling
  threads:
    virtual:
      enabled: true
  application:
    name: ruleforge-analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ruleforge
    username: ruleforge
    password: ruleforge_dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${RULEFORGE_JWT_SECRET:local-dev-jwt-secret-minimum-64-bytes-change-before-production-000000000000000000}
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 604800000

ruleforge:
  analytics:
    index-prefix: ruleforge-decisions
    retention-days: 90
