spring:
  application:
    name: ruleforge-solver-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ruleforge
    username: ruleforge
    password: ruleforge_dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: solver-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "domainEvent:io.ruleforge.common.event.DomainEvent"

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${RULEFORGE_JWT_SECRET:local-dev-jwt-secret-minimum-64-bytes-change-before-production-000000000000000000}
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 604800000
  auth-service:
    url: http://localhost:8081
