spring:
  application:
    name: ruleforge-connector-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ruleforge
    username: ruleforge
    password: ruleforge_dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${RULEFORGE_JWT_SECRET:local-dev-jwt-secret-minimum-64-bytes-change-before-production-000000000000000000}
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 604800000

ruleforge:
  encryption:
    secret-key: ${RULEFORGE_CONNECTOR_ENCRYPTION_KEY:local-dev-connector-credential-key}
