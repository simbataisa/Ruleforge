_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-routes
        paths:
          - /v1/auth
          - /v1/users
          - /v1/organizations
          - /v1/spaces
          - /v1/api-keys
          - /v1/sso
        strip_path: false

  - name: management-service
    url: http://management-service:8082
    routes:
      - name: management-routes
        paths:
          - /v1/rules
          - /v1/folders
          - /v1/tags
          - /v1/webhooks
        strip_path: false

  - name: solver-service
    url: http://solver-service:8083
    routes:
      - name: solver-routes
        paths:
          - /v1/solve
        strip_path: false
        methods:
          - POST

  - name: analytics-service
    url: http://analytics-service:8085
    routes:
      - name: analytics-routes
        paths:
          - /v1/analytics
        strip_path: false

  - name: ai-service
    url: http://ai-service:8000
    routes:
      - name: ai-routes
        paths:
          - /v1/ai
        strip_path: false

  - name: scheduler-service
    url: http://scheduler-service:8086
    routes:
      - name: scheduler-routes
        paths:
          - /v1/schedules
          - /v1/batch
        strip_path: false

  - name: connector-service
    url: http://connector-service:8087
    routes:
      - name: connector-routes
        paths:
          - /v1/connectors
          - /v1/connections
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
        - X-Strategy
        - X-Audit
        - x-api-key
      exposed_headers:
        - X-Correlation-Id
      credentials: true
      max_age: 3600

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
